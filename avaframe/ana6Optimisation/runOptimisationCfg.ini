### Config File - This file contains the main settings for the optimisation process 

# Sidenote: (1) when running runOptimisation.py the working directory needs to be in the ana6Optimisation folder
#           (2) avaDirectory in avaframeCfg.ini need ../ as prefix 		

# BO ... bayesian optimisation
# EI ... expected improvement


[GENERAL]
# USER input for running and plotting a comparison of simulation result to reference polygon
# These parameters correspond to the settings in runPlotAreaRefDiffs.py
resType = ppr
thresholdValueSimulation = 1
modName = com8MoTPSA
# layer to use for analysis (e.g. L1, L2)
layer = L2

# Output Settings:
# in this folder the results will be saved, avalancheDir + this folder
resultDir = Outputs/ana6Optimisation


[PARAM_BOUNDS]
# 2 scenarios: choose 1 or 2
# (1): morris is not run prior, this is the preferred scenario, input parameters and their bounds are read from a previously saved pickle file generated by ``runAna4ProbAnaCom8MoTPSA.py``. The parameter variation is determined by the configuration specified in ``probAnaCfg.ini``.
# (2): morris is run prior, in this case, a dataframe of ranked input parameters is already saved by runMorrisSA.py as pickle file, The optimisation is then based on morris samples, this is experimental, since Morris samples do not provide optimal coverage of the input space.
# The user only needs to determine how much input topN parameters to use for optimisation.
scenario = 1

# topN is only relevant for scenario 2: number of top ranked input parameters to use for optimisation
topN = 7


[LOSS_PARAMETERS]
# The loss function evaluates the agreement between simulation results and reference data. It is defined as a weighted sum of a modified Tversky score (1 - Tversky score) and the normalized runout length difference. Areal indicators are calculated only within the avalanche impact area, which is determined by the reference polygon and a cropshape polygon.

# alpha gives penalty if simulation overshoots the reference (FP)
# beta gives penalty if simulation falls short of the reference (FN)
tverskyAlpha = 2
tverskyBeta = 1

# Loss function: (1-TverskyScore) * weightTversky + RunoutNormalised * weightRunout
weightTversky = 0.25
weightRunout = 0.75


[GP_SURROGATE]
# Gaussian Process surrogate settings: The GP is implemented with GaussianProcessRegressor from scikit-learn.
# Kernel structure:
# ConstantKernel * MaternKernel + WhiteKernel

# ConstantKernel: controls the overall variation of predicted loss values
constant_value = 1.0
constant_bounds = 1e-3|1e3
# Matern kernel: controls similarity between parameter sets and smoothness
length_scale_initial = 1.0
length_scale_bounds = 1e-2|1e2
# Smoothness parameter of the Matern kernel
# Common values: 0.5, 1.5, 2.5
matern_nu = 2.5
# WhiteKernel: learnable noise term
white_noise_level = 1e-4
white_noise_bounds = 1e-8|1e-1

# Small fixed diagonal stabilization term, different from WhiteKernel noise
gp_alpha = 1e-8
# Normalize loss values internally before fitting
normalize_y = True
# Number of optimizer restarts for internal GP hyperparameter optimization
n_restarts_optimizer = 10
# Random seed for reproducible optimizer restarts
random_state = 0


[OPTIMISATION]
# Surrogate-based optimisation using a Gaussian Process (GP) surrogate.
# Non-sequential optimisation evaluates a fixed set of Latin Hypercube simulations to train the surrogate and predict the loss.
# Bayesian optimisation also uses the GP surrogate but sequentially selects new simulations using the Expected Improvement acquisition function.

# Type of optimisation: seq or nonseq
optType = seq
# define k for k-fold cross validation
k = 5
# sampling seed for generation of Latin Hypercube samples used for loss-prediction with surrogate
seed = 12345
# number of LH samples
n_lhs = 100000
# determine the number N of surrogate's best simulations used for statistics
n_surrogate_top = 100
# determine the number N of models best simulations used for statistics (n < available model runs)
n_model_top = 10

# settings for seq:
# xi controls the exploration–exploitation balance in the Expected Improvement acquisition function.
# Increasing xi (e.g., xi = 0.01) encourages exploration (sampling uncertain regions).
# Decreasing xi (e.g., xi = 0.0) favors exploitation (sampling near the current optimum).
# In practice, xi is typically chosen as a small non-negative value (e.g., 0.0–0.1).
xi = 0.0

# If EI falls below the threshold, the simulation is counted as 'good'. The sequential optimisation stops once the specified number of good simulations is reached. Otherwise, the optimisation terminates after bo_max_iterations.
eiThreshold = 0.01
numberOfGoodSimulations = 10
bo_max_iterations = 40

# Flag for saving comparison boxplots. Requires finalDF.pickle to exist for both avalanche paths.
saveComparisonBoxplot = False
avaName1 =
avaName2 =


[ana3AIMEC_ana3AIMEC_override]
# use default ana3AIMEC config as base configuration (True) and override following parameters
# if False and local is available use local
defaultConfig = True
# computational module that was used to produce avalanche simulations (to locate peakFiles)
anaMod = com8MoTPSA
# data result type for general analysis (ppr|pft|pfv). If left empty takes the result types available for all simulations
resTypes = ppr
# data result type for runout analysis (ppr, pft, pfv)
runoutResType = ppr
# layer to use for analysis (e.g. L1, L2). Leave empty for single-layer modules.
# Required when analyzing multi-layer results (e.g. com8MoTPSA).
runoutLayer = L2
# show cross profile max or mean values on slComparisonstat plot (options: Max, Mean)
runoutCrossType = Max
# limit value for evaluation of runout (depends on the runoutResType chosen)
thresholdValue = 1
# +++++++++++ reference data from e.g. documented events
# inputs need to be located in Inputs/REFDATA
includeReference = True


[com1DFA_com1DFA_override]
# use default com1DFA config as base configuration (True) and override following parameters
# if False and local is available use local
defaultConfig = True


[com8MoTPSA_com8MoTPSA_override]
# use default com8MoTPSA config as base configuration (True) and override following parameters
# if False and local is available use local
defaultConfig = True
