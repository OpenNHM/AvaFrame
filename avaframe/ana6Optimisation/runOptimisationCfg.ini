### Config File - This file contains the main settings for the optimisation process 

# Sidenote: (1) when running runOptimisation.py the working directory needs to be in the ana6Optimisation folder
#           (2) avaDirectory in avaframeCfg.ini need ../ as prefix 		

# BO ... bayesian optimisation
# ei ... expected improvement


[GENERAL]
# USER input for running and plotting a comparison of simulation result to reference polygon
resType = ppr
thresholdValueSimulation = 1
modName = com8MoTPSA
# in this folder the results will be saved, avalancheDir + this folder
resultDir = Outputs/ana6Optimisation


[PARAM_BOUNDS]
# 2 scenarios: choose 1 or 2
scenario = 2
#(1): morris is run prior, then dataframe of ranked input parameters is already saved by runMorris.py as pickle file, user only need to determine how much input paramters to use for optimisation
topN = 6
# (2): morris is not run prior, input parameters and their bounds are read from a previously saved pickle file generated by ``runAna4ProbAnaCom8MoTPSA.py``. The parameter variation is determined by the configuration specified in ``probAnaCfg.ini``.


[LOSS_PARAMETERS]
# alpha gives penalty if sim. overshoot the ref. (FP)
# beta gives penalty if sim. comes short compared to the ref. (FN)
tverskyAlpha = 2 
tverskyBeta = 1 

weightTversky = 0.25
weightRunout = 0.75


[OPTIMISATION]
# Type of optimisation: seq or nonseq
optType = seq
# define the smoothness of the matern kernel of the surrogate, e.g.: 0.5, 1.5, 2.5
matern_nu = 2.5
# define k for k-fold cross validation
k = 5 
# sampling seed for generation of Latin Hypercube samples used for loss-prediction with surrogate
seed = 12345
# number of LH samples
n_lhs = 1000000
# determine the number N of surrogate's best simulations used for statistics
n_surrogate_top = 100
# determine the number N of models best simulations used for statistics (n < available model runs)
n_model_top = 6

# settings for seq:
# if ei is smaller than threshold, the simulation is counted as 'good', if number of good simulations is reached, optimisation stops
eiThreshold = 0.01
numberOfGoodSimulations = 5
bo_max_iterations = 2



